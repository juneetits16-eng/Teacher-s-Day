<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Happy Teacher's Day</title>
</head>
<body>
    <div class="confetti">✨</div>
    <div class="confetti">💖</div>
    <div class="confetti">⭐</div>
    <div class="confetti">🌸</div>
    <div class="main-box">
          <span class="heart left-heart">❤️</span>
        <span class="heart right-heart">❤️️</span>
        
    <h1 class="glow-text">Happy Teacher's Day!</h1>
        <h2>Thank You!</h2>
    <img src="ITE.jpeg" alt="Class Photo">
    <p>Happy Teacher's Day po maam/sir thank you very much sa walang sawang pag tuturo at pag guide sa amin for our future.You all have become part of our life and memories and for that we your students,  are very thankful.</p>

<audio id="mySong" src="pahintulot.mp3"></audio>
        <button id="musicBtn" class="btn-link" onclick="toggleMusic()">Play Music 🎵</button>
  </div>
  
  <script>
        function toggleMusic() {
            var song = document.getElementById("mySong");
            var btn = document.getElementById("musicBtn");

            if (song.paused) {
                song.play();
                btn.innerText = "Pause Music ⏸️";
            } else {
                song.pause();
                btn.innerText = "Play Music 🎵";
            }
        }
    </script>
</body>
</html>
